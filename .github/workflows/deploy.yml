name: Manual Deploy to Dokploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Trigger Dokploy deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Dokploy Deployment Webhook
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK || 'https://dokploy.desimone.fr/api/deploy/kT8qjozNoHE0rdsAB_Sfl' }}
        run: |
          echo "🚀 Déclenchement manuel du webhook de déploiement Dokploy..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"ref": "refs/heads/main"}' \
            "$DOKPLOY_DEPLOY_WEBHOOK")

          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          if [ "$http_status" = "200" ]; then
            echo "✅ Déploiement Dokploy déclenché avec succès ! (HTTP $http_status)"
            echo "Payload: $body"
          else
            echo "❌ Échec du déploiement Dokploy (HTTP $http_status)"
            echo "Réponse: $body"
            exit 1
          fi
