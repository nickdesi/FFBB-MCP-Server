name: Deploy to Coolify

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Ne se lance que sur action manuelle OU si le workflow de CI sur main a réussi
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Trigger deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_HOOK }}
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          echo "Déclenchement du déploiement Coolify..."
          result=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$COOLIFY_WEBHOOK")
          if [ "$result" = "200" ] || [ "$result" = "202" ]; then
            echo "✅ Déploiement déclenché (HTTP $result)"
          else
            echo "::warning::Échec déclenchement Coolify (HTTP $result)"
          fi

      - name: No webhook configured
        if: env.COOLIFY_WEBHOOK == ''
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_HOOK }}
        run: |
          echo "ℹ️  Aucun webhook Coolify configuré."
          echo "Pour l'activer :"
          echo "1. Coolify → ton projet → Webhooks → copier l'URL"
          echo "2. GitHub → Settings → Secrets → COOLIFY_DEPLOY_HOOK"
