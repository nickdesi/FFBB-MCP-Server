name: Benchmark

on:
  schedule:
    - cron: "0 7,12,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    name: Run performance benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger benchmark
        run: |
          result=$(curl -s -o /tmp/benchmark.json -w "%{http_code}" \
            -X POST "https://ffbb.desimone.fr/benchmark/run" \
            -H "Content-Type: application/json")
          if [ "$result" != "200" ] && [ "$result" != "201" ]; then
            echo "::error::Benchmark failed with HTTP $result"
            cat /tmp/benchmark.json
            exit 1
          fi
          total_ms=$(python3 -c "import json; d=json.load(open('/tmp/benchmark.json')); print(d.get('total_ms','?'))")
          success=$(python3 -c "import json; d=json.load(open('/tmp/benchmark.json')); print(d.get('success',False))")
          echo "✅ Benchmark: $total_ms ms — success=$success"
