name: AI Pull Request Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit PR with Gemini IA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.event.pull_request.head.repo.fork == false && secrets.GEMINI_API_KEY != '' }}
    # S'exécute uniquement si le secret GEMINI_API_KEY est configuré pour éviter de tourner dans le vide
    # On vérifie sa présence (non vide) de manière sécurisée
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Nécessaire pour avoir l'historique de commit et faire le diff

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"

      - name: Run AI Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ℹ️ GEMINI_API_KEY n'est pas configuré. Veuillez ajouter ce secret dans les paramètres de votre dépôt GitHub pour activer l'audit par IA gratuit."
            exit 0
          fi
          uv run tools/ai_pr_audit.py
