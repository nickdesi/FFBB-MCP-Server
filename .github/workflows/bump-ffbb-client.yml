name: Auto-bump ffbb-data-client

on:
  # Triggered by a repository_dispatch from ffbb-data-client's publish workflow
  repository_dispatch:
    types: [ffbb-client-released]

  # Fallback: check weekly on Wednesday at 07:00 UTC if a new PyPI version is available
  schedule:
    - cron: '0 7 * * 3'

  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: bump-ffbb-data-client
  cancel-in-progress: true

jobs:
  bump:
    name: Bump ffbb-data-client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve current version in uv.lock
        id: current
        run: |
          VERSION=$(uv export --frozen --no-emit-project --no-hashes | sed -n 's/^ffbb-data-client==//p' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run uv lock upgrade
        run: uv lock --upgrade-package ffbb-data-client

      - name: Resolve new version in uv.lock
        id: new
        run: |
          VERSION=$(uv export --frozen --no-emit-project --no-hashes | sed -n 's/^ffbb-data-client==//p' | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if no change
        if: steps.current.outputs.version == steps.new.outputs.version
        run: |
          echo "ffbb-data-client already at ${{ steps.new.outputs.version }}, nothing to do."

      - name: Create Pull Request
        if: steps.current.outputs.version != steps.new.outputs.version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BUMP_BOT_TOKEN || github.token }}
          commit-message: "chore: bump ffbb-data-client to v${{ steps.new.outputs.version }}"
          branch: chore/bump-ffbb-client-${{ steps.new.outputs.version }}
          title: "chore: bump ffbb-data-client ${{ steps.current.outputs.version }} -> ${{ steps.new.outputs.version }}"
          body: |
            ## Automatic dependency bump

            | Package | From | To |
            |---|---|---|
            | `ffbb-data-client` | `${{ steps.current.outputs.version }}` | `${{ steps.new.outputs.version }}` |

            Triggered by: `${{ github.event_name }}`

            > Auto-generated by the `bump-ffbb-client` workflow.
            >
            > Configure `secrets.BUMP_BOT_TOKEN` with a PAT to let CI run on this PR.
          labels: dependencies
          delete-branch: true
