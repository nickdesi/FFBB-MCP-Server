name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check version alignment
        run: uv run python tools/check_version_alignment.py "${GITHUB_REF#refs/tags/}"

      - name: Build package
        run: uv build

      - name: Build VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run package

      - name: Publish to PyPI
        run: |
          output=$(uv publish --trusted-publishing automatic --check-url https://pypi.org/simple/ 2>&1) || {
            status=$?
            echo "$output"
            if echo "$output" | grep -iq "File already exists"; then
              echo "::warning::Package distribution already exists on PyPI. Skipping duplicate upload."
              exit 0
            fi
            exit $status
          }
          echo "$output"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            vscode-extension/*.vsix
