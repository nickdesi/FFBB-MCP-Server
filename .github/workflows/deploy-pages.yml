name: Deploy landing page to Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Use a PAT so the push triggers the pages deployment
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Inject Version and Date into HTML
        run: python3 tools/sync_version.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add website/index.html website/sitemap.xml README.md docs/TOOLS_REFERENCE.md CHANGELOG.md uv.lock
          git commit -m "chore: sync version strings [skip ci]" || echo "No changes to commit"
          git push

  deploy:
    needs: sync-version
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Pull the freshly committed version
          ref: main

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'website-docs/package.json'

      - name: Install documentation dependencies
        run: npm install
        working-directory: website-docs

      - name: Build documentation
        run: npm run docs:build
        working-directory: website-docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
