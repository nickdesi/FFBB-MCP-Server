[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffbb-mcp-server"
version = "1.3.1"
description = "MCP Server for FFBB (Fédération Française de Basketball) data"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp[cli]>=1.27.0",
    "ffbb-data-client>=2.1.0,<3.0.0",
    "httpx>=0.28.0",
    "uvicorn>=0.30.0,<1.0.0",
    "starlette<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "cachetools>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/nickdesi/FFBB-MCP-Server"
Repository = "https://github.com/nickdesi/FFBB-MCP-Server"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.12",
    "mypy>=1.15.0",
    "types-cachetools>=7.0.0.20260503",
    "types-setuptools",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
ffbb-mcp = "ffbb_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["website/*", "website/css/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=ffbb_mcp --cov-fail-under=65"

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".agent",
    ".git",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "ffbb-data-client_Ref",
    "external",
    "external/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "TCH"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "RUF059", "F821"]
"tools/*" = ["S110"]
"src/ffbb_mcp/prompts.py" = ["RUF001", "RUF003"]
"src/ffbb_mcp/cache_strategy.py" = ["RUF003"]
"src/ffbb_mcp/server.py" = ["RUF001"]
"src/ffbb_mcp/services/*" = ["E402"]

[[tool.mypy.overrides]]
module = ["cachetools"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "starlette.middleware.base"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ffbb_mcp.services"
disable_error_code = ["attr-defined"]
