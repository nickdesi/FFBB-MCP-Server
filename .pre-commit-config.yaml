minimum_pre_commit_version: '3.7.0'
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: ["src/ffbb_mcp", "--explicit-package-bases"]
        pass_filenames: false
        additional_dependencies: [
            "types-cachetools>=7.0.0.20260503",
            "types-setuptools",
        ]

  - repo: local
    hooks:
      - id: update-agents-md
        name: Régénère AGENTS.md (compteurs de lignes)
        entry: uv run python tools/update_agents_md.py
        language: system
        pass_filenames: false
        files: ^(src/ffbb_mcp/.*\.py|tools/update_agents_md\.py)$
