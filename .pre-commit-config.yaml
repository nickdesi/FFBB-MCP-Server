minimum_pre_commit_version: '3.7.0'
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
